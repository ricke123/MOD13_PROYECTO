name: forecasting
channels:
  - conda-forge
  - defaults
dependencies:
  # Paquetes de conda (mejor rendimiento y estabilidad)
  - python=3.11
  - numpy>=1.21.0,<2.0.0
  - pandas>=1.5.0,<2.2.0
  - scikit-learn>=1.0.0,<1.5.0
  - xgboost>=1.7.0,<2.1.0
  - joblib>=1.2.0
  - python-dateutil>=2.8.0
  - plotly=5.17.0
  - pip
  # Pip solo para lo no disponible en conda (o versiones exactas)
  - pip:
      - fastapi==0.104.1
      - "uvicorn[standard]==0.24.0"
      - streamlit==1.28.0
      - mlflow==2.8.1
      - schedule
